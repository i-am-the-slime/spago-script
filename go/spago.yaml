package:
  name: spago-script-go
  description: Script.Prelude for PureScript scripts compiled to Go with Iris
  dependencies:
    - aff
    - arrays
    - control
    - datetime
    - effect
    - either
    - exceptions
    - foldable-traversable
    - foreign
    - foreign-object
    - go-bytes
    - go-exec
    - go-http
    - go-io
    - go-os
    - go-time
    - integers
    - lists
    - maybe
    - newtype
    - now
    - numbers
    - prelude
    - record
    - refs
    - strings
    - tailrec
    - transformers
    - tuples
    - typelevel-prelude
    - yoga-format
    - yoga-json
    - yoga-om
  test:
    main: Test.Main
    dependencies:
      - spec
workspace:
  packageSet:
    registry: 77.9.0
  extraPackages:
    go-bytes:
      git: https://github.com/i-am-the-slime/purescript-go.git
      ref: v0.3.0
      subdir: packages/go-bytes
    go-exec:
      git: https://github.com/i-am-the-slime/purescript-go.git
      ref: v0.3.0
      subdir: packages/go-exec
    go-http:
      git: https://github.com/i-am-the-slime/purescript-go.git
      ref: v0.3.0
      subdir: packages/go-http
    go-io:
      git: https://github.com/i-am-the-slime/purescript-go.git
      ref: v0.3.0
      subdir: packages/go-io
    go-os:
      git: https://github.com/i-am-the-slime/purescript-go.git
      ref: v0.3.0
      subdir: packages/go-os
    go-time:
      git: https://github.com/i-am-the-slime/purescript-go.git
      ref: v0.3.0
      subdir: packages/go-time
