name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install terminal test dependency
        run: sudo apt-get update && sudo apt-get install --yes expect

      - name: Run unit and CLI tests
        run: bun run test

      - name: Run interactive terminal tests
        run: bun run pty:test

      - name: Verify package payload
        run: npm pack --dry-run
